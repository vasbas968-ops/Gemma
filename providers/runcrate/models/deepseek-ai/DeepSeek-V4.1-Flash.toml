# Prices: GET https://www.runcrate.ai/api/models/catalog (accessed 2026-10-24), USD per 1M tokens as billed
# (deepseek-ai/DeepSeek-V4.1-Flash): input 0.147, cached input 0.00441, output 0.441. context_length 1,048,576 there and in
# GET https://api.runcrate.ai/v1/models.
# Effort: reasoning_effort = none|low|high|max on POST https://api.runcrate.ai/v1/chat/completions
# (live 2026-10-24). `none` turns thinking off (0 reasoning tokens, no reasoning_content); low, high
# and max are accepted and passed through (DeepSeek V4 effort levels, same as the lab and peers).
# Reasoning text is returned in reasoning_content (live).
# Live 2026-10-24: PNG and JPEG image input answered correctly; a tool call round-tripped; a strict
# json_schema response validated; a repeated 7,034-token prompt reported 6,912 cached_tokens.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.147
cache = { read = 0.00441 }

[cost.text.output]
price = 0.441
