# Prices: GET https://www.runcrate.ai/api/models/catalog (accessed 2026-10-24), USD per 1M tokens as billed
# (deepseek-ai/DeepSeek-V3.2): input 0.273, cached input 0.1365, output 0.399. context_length 163,840
# there; max_output_length 16,384 in GET https://api.runcrate.ai/v1/models.
# Effort: reasoning_effort = none|high on POST https://api.runcrate.ai/v1/chat/completions (live
# 2026-10-24). Omitted or none: no thinking (no reasoning_content); low or high: thinking on, about
# 2,400 to 2,800 reasoning tokens on one prompt with no difference between the two, so two states as
# on same-model peers. thinking.type and enable_thinking are ignored. Reasoning is in reasoning_content.
# Live 2026-10-24: a tool call round-tripped (192 of 308 prompt tokens reported cached); a strict
# json_schema response validated; image input is refused with HTTP 400.
schema = 2
base_model = "deepseek/deepseek-v3.2"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 163_840
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.273
cache = { read = 0.1365 }

[cost.text.output]
price = 0.399
